- name: create 45Drives ocf directory
  file:
    path: /usr/lib/ocf/resource.d/45drives
    state: directory
    owner: root
    group: root
    mode: 0755  

- name: Create 45Drives OCF resource agent files
  copy:
    src: "files/{{ item }}"
    dest: "/usr/lib/ocf/resource.d/45drives/{{ item }}"
    owner: "root"   
    mode: "0755"
  with_items:
    - iSCSILogicalUnit
    - iSCSITarget
    - IPaddr2
    - LVM-activate
    - portblock
    - rbd


